name: Weekly ThePornDude Provider Refresh

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  refresh-providers:
    name: Scrape and Update Free Providers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape ThePornDude free sections
        run: npm run scrape:providers

      - name: Commit updated providers database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(providers): automated weekly refresh from theporndude.com [skip ci]'
          file_pattern: 'data/nexus18.db'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
