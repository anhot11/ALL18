name: Build Android APK (All18 Native)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compile All18 APK (com.all18.nativeapp)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Release Asset
        run: |
          mkdir -p release_builds
          cp app/build/outputs/apk/debug/app-debug.apk release_builds/all18.apk
          ls -lh release_builds/all18.apk
          sha256sum release_builds/all18.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all18-native-apk
          path: release_builds/all18.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: 'All18 APK v1.2.0 (Native Android Official)'
          body: |
            ### 🚀 All18 Android APK v1.2.0 (Official Native Build)
            Compilado automáticamente mediante GitHub Actions con la arquitectura nativa en Kotlin y Jetpack Compose (`com.all18.nativeapp`).

            #### 🌟 Características
            - **AllTube**: 100% UI Pornhub nativa con catálogo completo de sitios gratuitos.
            - **TikTok**: 100% UI TikTok vertical full-screen con modo foto y scrubber.
            - **𝕏 Feed**: 100% UI Twitter / 𝕏 con pestañas dinámicas y reproductor integrado.
            - **Silencio Total (0 dB)**: Reproducción segura garantizada con `SilentPlayerManager`.
            - **Bypass Anti-Censura**: DNS sobre HTTPS (`AppDns` con Google y Cloudflare DoH) para evasión de bloqueos ISP.
          files: release_builds/all18.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
